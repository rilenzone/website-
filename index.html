<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover More</title>
  <meta name="description" content="Explore more information.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #20242b;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      padding: 42px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 14px; font-size: 32px; }
    p {
      margin: 0 auto 24px;
      max-width: 430px;
      line-height: 1.6;
      color: #5d6572;
    }
    .button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      background: #1f2937;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .note {
      margin-top: 22px;
      font-size: 12px;
      color: #8a919c;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Discover More</h1>
    <p>
      Looking for something new and interesting?
      Explore the information below and decide whether you would like to continue.
    </p>

    <!-- Replace the URL below with your own approved Adsterra SmartLink. -->
    <a class="button"
       href="PASTE_YOUR_ADSTERRA_SMARTLINK_HERE"
       rel="nofollow sponsored">
      Continue
    </a>

    <div class="note">
      Promotional link. Please review the information on the next page before proceeding.
    </div>
  </main>
</body>
</html>
